<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ek Bahut Important Sawaal ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rozha+One&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

:root {
  --pink: #ff758c;
  --hot-pink: #ff0055;
  --yellow: #fff56b;
  --red: #e63946;
  --dark: #17171c;
  --green: #4ade80;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 15% 15%, #fff87a 0 10%, transparent 30%),
    radial-gradient(circle at 85% 85%, #ff9db0 0 10%, transparent 30%),
    linear-gradient(135deg, #fff56b 0%, #ff758c 55%, #ff91a3 100%);
  font-family: "Comic Neue", cursive;
  touch-action: manipulation;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image: radial-gradient(#17171c 1px, transparent 1px);
  background-size: 18px 18px;
}

.card {
  position: relative;
  z-index: 10;
  width: min(490px, 94vw);
  padding: 28px 25px 30px;
  background: white;
  border: 5px solid var(--dark);
  border-radius: 26px;
  box-shadow: 10px 10px 0 var(--dark);
  text-align: center;
  overflow: hidden;
}

.intro { display: block; }
.intro-small {
  font-size: 1rem;
  font-weight: 700;
  color: #555;
  margin-bottom: 8px;
}
.intro-title {
  font-family: "Bangers", cursive;
  font-size: clamp(3rem, 14vw, 4.5rem);
  line-height: .95;
  color: var(--red);
  text-shadow: 3px 3px 0 var(--yellow), 6px 6px 0 var(--dark);
  margin: 5px 0 20px;
  transform: rotate(-2deg);
}
.intro-message {
  font-size: 1.15rem;
  line-height: 1.5;
  color: #333;
  margin-bottom: 25px;
}
.intro-message b { color: var(--hot-pink); }
.start-btn {
  width: 100%;
  border: 4px solid var(--dark);
  border-radius: 50px;
  padding: 15px 20px;
  background: var(--yellow);
  color: var(--dark);
  font-family: "Bangers", cursive;
  font-size: 1.8rem;
  letter-spacing: 1px;
  box-shadow: 5px 5px 0 var(--dark);
  cursor: pointer;
  transition: .15s;
}
.start-btn:hover { transform: translateY(-3px) rotate(-1deg); }
.start-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--dark); }

.quiz { display: none; }
.question-number {
  font-size: .9rem;
  font-weight: 700;
  color: #777;
  margin-bottom: 8px;
}
.comic-title {
  font-family: "Bangers", cursive;
  font-size: clamp(2.5rem, 11vw, 3.6rem);
  line-height: 1.05;
  color: var(--red);
  text-shadow: 2px 2px 0 var(--yellow), 5px 5px 0 var(--dark);
  margin: 0 0 25px;
  transform: rotate(-1deg);
}
.sub-question {
  font-size: 1rem;
  color: #555;
  margin-bottom: 15px;
}
.timer-banner {
  display: none;
  background: #ffe066;
  border: 3px solid var(--dark);
  padding: 7px 14px;
  font-weight: 900;
  margin-bottom: 15px;
  border-radius: 10px;
  color: #d00000;
  box-shadow: 3px 3px 0 var(--dark);
  animation: dangerPulse .7s infinite alternate;
}
@keyframes dangerPulse {
  from { transform: scale(1); }
  to { transform: scale(1.04); }
}
.button-area {
  position: relative;
  min-height: 175px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-top: 20px;
}
.btn {
  width: 100%;
  padding: 14px 20px;
  border: 4px solid var(--dark);
  border-radius: 50px;
  font-family: "Comic Neue", cursive;
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 5px 5px 0 var(--dark);
  user-select: none;
  transition: transform .18s cubic-bezier(.175,.885,.32,1.275), background .2s;
  -webkit-tap-highlight-color: transparent;
}
.btn-yes { background: var(--green); color: #064e3b; position: relative; z-index: 3; }
.btn-no { background: #f87171; color: #450a0a; position: relative; z-index: 5; }
.btn:active { box-shadow: 2px 2px 0 var(--dark); }

.result { display: none; animation: popIn .6s cubic-bezier(.175,.885,.32,1.275); }
@keyframes popIn {
  0% { transform: scale(.55) rotate(-4deg); opacity: 0; }
  70% { transform: scale(1.05) rotate(1deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
.result-badge {
  font-family: "Bangers", cursive;
  font-size: 2rem;
  color: var(--hot-pink);
  line-height: 1.1;
  animation: badgePulse 1s infinite alternate;
}
@keyframes badgePulse {
  from { transform: scale(1); }
  to { transform: scale(1.07); }
}
.result-gif { margin-top: 15px; }
.result-gif img {
  width: 100%;
  max-height: 245px;
  object-fit: cover;
  border-radius: 16px;
  border: 4px solid var(--dark);
  box-shadow: 5px 5px 0 var(--dark);
}
.result-heading {
  font-family: "Bangers", cursive;
  font-size: 1.8rem;
  color: var(--hot-pink);
  margin: 17px 0 5px;
}
.shayari {
  margin-top: 17px;
  padding: 17px;
  background: #fff0f3;
  border: 2px dashed #ff4d6d;
  border-radius: 16px;
  font-family: "Rozha One", serif;
  font-size: 1.3rem;
  line-height: 1.6;
  color: #800020;
}
.final-line {
  margin-top: 8px;
  font-family: "Comic Neue", cursive;
  font-size: 1rem;
  color: var(--hot-pink);
  font-weight: 700;
}

.floating-cutout {
  position: fixed;
  width: 92px;
  height: 92px;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid #ff4d6d;
  background: white;
  box-shadow: 0 7px 18px rgba(0,0,0,.35);
  pointer-events: none;
  z-index: 5;
  animation: floatAround 5s infinite ease-in-out;
}
@keyframes floatAround {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-24px) rotate(8deg); }
}

.heart {
  position: fixed;
  bottom: -30px;
  font-size: 24px;
  pointer-events: none;
  z-index: 2;
  animation: heartFloat linear forwards;
}
@keyframes heartFloat {
  from { transform: translateY(0) rotate(0); opacity: 1; }
  to { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
}

@media (max-width: 500px) {
  body { padding: 12px; }
  .card { padding: 23px 18px 25px; box-shadow: 7px 7px 0 var(--dark); }
  .button-area { min-height: 185px; }
  .floating-cutout { width: 68px; height: 68px; border-width: 3px; }
  .shayari { font-size: 1.2rem; }
}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="intro" id="intro">
    <div class="intro-small">🚨 PRIVATE MESSAGE 🚨</div>
    <div class="intro-title">ANUJA JI...</div>
    <div class="intro-message">
      Aapke liye ek <b>bahut hi important</b> sawaal hai.
      <br><br>
      Is sawaal ka jawab aapki <b>zindagi</b> badal sakta hai.
      <br><br>
      Ya phir...
      <br>
      <b>₹7 CRORE</b> dilwa sakta hai. 😌
    </div>
    <button class="start-btn" id="startBtn" type="button">SAWAAL SUNNA HAI? 👀</button>
  </div>

  <div class="quiz" id="quiz">
    <div class="question-number">QUESTION NO. 1 OF 1</div>
    <div class="timer-banner" id="timerDisplay">
      ⚠️ BOMB DETONATES IN: <span id="countdown">5</span>s
    </div>
    <div class="comic-title">AAP KISKE BETU HAI?</div>
    <div class="sub-question">Soch samajh ke jawab dena. 👀</div>
    <div class="button-area" id="buttonArea">
      <button class="btn btn-yes" id="yesBtn" type="button">1. Apne बबडू ka 🥰</button>
      <button class="btn btn-no" id="noBtn" type="button">2. Kisika nahi 😒</button>
    </div>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
// Floating photo cutouts
const photos = [
  "https://i.postimg.cc/BnSNH8WV/0C9A7F0B-3DAF-4A96-84AF-A1221B90C016-4-5005-c.jpg",
  "https://i.postimg.cc/Qxk0FQPD/1E2BD491-3F1F-4589-A2D3-03C3CE5E711D-4-5005-c.jpg",
  "https://i.postimg.cc/TYqCKVsB/C8071C15-23D7-4D26-A5F6-BF783B8251D7-1-105-c.jpg",
  "https://i.postimg.cc/Qxk0FQPD/1E2BD491-3F1F-4589-A2D3-03C3CE5E711D-4-5005-c.jpg",
  "https://i.postimg.cc/TYqCKVsB/C8071C15-23D7-4D26-A5F6-BF783B8251D7-1-105-c.jpg"
];

// Direct PostImage GIF URLs
const GIF_7_CRORE = "https://i.postimg.cc/Qx4TtSD6/kbc-memes-7crore-meme.gif";
const GIF_VOMIT_KHEER = "https://i.postimg.cc/VkJbbMsG/sooryavansham-amitabh-vomit.gif";

let audioCtx = null;
let timer = 5;
let timerInterval = null;
let dodgeCount = 0;
let finished = false;
let musicStarted = false;

const intro = document.getElementById("intro");
const quiz = document.getElementById("quiz");
const result = document.getElementById("result");
const startBtn = document.getElementById("startBtn");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const timerDisplay = document.getElementById("timerDisplay");
const countdown = document.getElementById("countdown");

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function tone(frequency, duration, type = "sine", volume = .2) {
  initAudio();
  const now = audioCtx.currentTime;
  const oscillator = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, now);
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(.001, now + duration);
  oscillator.connect(gain);
  gain.connect(audioCtx.destination);
  oscillator.start(now);
  oscillator.stop(now + duration);
}

function dodgeSound() {
  initAudio();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(250, now);
  osc.frequency.exponentialRampToValueAtTime(1000, now + .18);
  gain.gain.setValueAtTime(.28, now);
  gain.gain.exponentialRampToValueAtTime(.001, now + .18);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + .18);
}

function tickSound() {
  tone(1200, .06, "square", .16);
}

function boomSound() {
  initAudio();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(25, now + .9);
  gain.gain.setValueAtTime(.65, now);
  gain.gain.exponentialRampToValueAtTime(.001, now + .9);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + .9);
}

function winSound() {
  const notes = [523.25, 659.25, 783.99, 1046.50];
  notes.forEach((frequency, index) => {
    setTimeout(() => {
      tone(frequency, .45, "triangle", .22);
    }, index * 100);
  });
}

function startRomanticMusic() {
  if (musicStarted) return;
  musicStarted = true;
  const melody = [
    [392, .4], [440, .4], [493.88, .6], [587.33, .8],
    [523.25, .5], [493.88, .5], [440, .9], [392, 1.2]
  ];
  let position = 0;

  function playLoop() {
    if (!musicStarted) return;
    initAudio();
    const start = audioCtx.currentTime + .2;
    melody.forEach(([frequency, duration]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(frequency, position ? position : start);
      const noteStart = position || start;
      gain.gain.setValueAtTime(0, noteStart);
      gain.gain.linearRampToValueAtTime(.12, noteStart + .05);
      gain.gain.exponentialRampToValueAtTime(.001, noteStart + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(noteStart);
      osc.stop(noteStart + duration);
      position = noteStart + duration;
    });
    setTimeout(() => {
      position = 0;
      playLoop();
    }, 4500);
  }
  playLoop();
}

startBtn.addEventListener("click", () => {
  initAudio();
  tone(523.25, .12, "triangle", .18);
  setTimeout(() => {
    tone(783.99, .18, "triangle", .18);
  }, 120);
  intro.style.display = "none";
  quiz.style.display = "block";
});

function dodgeButton(event) {
  if (finished) return;
  if (event) event.preventDefault();
  dodgeCount++;
  dodgeSound();
  if (dodgeCount === 1) startBombTimer();

  const card = document.getElementById("card");
  const cardRect = card.getBoundingClientRect();
  const buttonRect = noBtn.getBoundingClientRect();
  const availableX = Math.max(50, (cardRect.width - buttonRect.width) / 2);
  const x = (Math.random() * 2 - 1) * Math.min(availableX, 125);
  const y = (Math.random() * 2 - 1) * 80;
  const rotation = Math.random() * 26 - 13;

  noBtn.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
  if (dodgeCount === 3) noBtn.innerText = "ABEY 😭";
  else if (dodgeCount === 5) noBtn.innerText = "PAKAD KE BATAO 😭";
  else if (dodgeCount >= 8) noBtn.innerText = "BASSSS 💀";
}

noBtn.addEventListener("mouseenter", dodgeButton);
noBtn.addEventListener("touchstart", dodgeButton, { passive: false });
noBtn.addEventListener("click", dodgeButton);

function startBombTimer() {
  if (timerInterval) return;
  timer = 5;
  timerDisplay.style.display = "inline-block";
  countdown.innerText = timer;
  tickSound();
  timerInterval = setInterval(() => {
    timer--;
    countdown.innerText = timer;
    if (timer > 0) tickSound();
    if (timer <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      explode();
    }
  }, 1000);
}

yesBtn.addEventListener("click", () => {
  if (finished) return;
  finished = true;
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  initAudio();
  winSound();
  setTimeout(startRomanticMusic, 500);

  quiz.style.display = "none";
  timerDisplay.style.display = "none";
  result.style.display = "block";

  result.innerHTML = `
    <div class="result-badge">🎉 FINAL ANSWER LOCKED 🎉</div>
    <div class="result-badge" style="font-size:2.5rem;margin-top:5px;">₹7 CRORE!</div>
    <div class="result-gif">
      <img src="${GIF_7_CRORE}" alt="KBC 7 Crore">
    </div>
    <div class="result-heading">SAHI JAWAAB! 😌❤️</div>
    <div class="shayari">
      "मुझे तुमसे मोहब्बत है दीवानगी की हद तक,<br>
      दीवाना मुझे बनाओ ना दीवानगी की हद तक।" ❤️
      <div class="final-line">Hope you have a wonderful day, cutie patotie. 🌹</div>
    </div>
  `;
  spawnPhotos();
  startHearts();
});

function explode() {
  if (finished) return;
  finished = true;
  boomSound();
  setTimeout(startRomanticMusic, 700);

  quiz.style.display = "none";
  result.style.display = "block";

  result.innerHTML = `
    <div class="result-badge" style="color:#d00000;">💥 BOOM! 💥</div>
    <div class="result-badge" style="color:#d00000;font-size:1.9rem;">ZEHER WALI KHEER KHA LI!</div>
    <div class="result-gif">
      <img src="${GIF_VOMIT_KHEER}" alt="Sooryavansham Zeher Wali Kheer Vomit">
    </div>
    <p style="font-weight:700;color:#555;margin:14px 0 0;">Dekha? Option 2 choose karne ka nateeja. 😭😂</p>
    <div class="shayari">
      Par phir bhi...<br><br>
      <b>"मुझे तुमसे मोहब्बत है दीवानगी की हद तक,<br>
      दीवाना मुझे बनाओ ना दीवानगी की हद तक।"</b> ❤️
      <div class="final-line">Have a sweet & beautiful day! 🌹</div>
    </div>
  `;
  spawnPhotos();
  startHearts();
}

function spawnPhotos() {
  const positions = [
    { top: "6%", left: "4%" },
    { top: "8%", right: "4%" },
    { bottom: "8%", left: "5%" },
    { bottom: "6%", right: "4%" },
    { top: "45%", left: "2%" }
  ];

  positions.forEach((position, index) => {
    const image = document.createElement("img");
    image.src = photos[index % photos.length];
    image.className = "floating-cutout";
    Object.assign(image.style, position);
    image.style.animationDelay = `${index * .65}s`;
    document.body.appendChild(image);
  });
}

function startHearts() {
  let count = 0;
  const interval = setInterval(() => {
    createHeart();
    count++;
    if (count >= 18) clearInterval(interval);
  }, 350);
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerText = Math.random() > .5 ? "❤️" : "💕";
  heart.style.left = `${Math.random() * 100}vw`;
  heart.style.animationDuration = `${4 + Math.random() * 3}s`;
  heart.style.fontSize = `${18 + Math.random() * 18}px`;
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}
</script>
</body>
</html>
